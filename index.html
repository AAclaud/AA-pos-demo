// ── Variantes / excepciones de un ítem ────────────────────────────
// Muestra "sin cebolla" bajo la línea y el lápiz para editarla
function LineaVariantes({linea,mi,onEditar}){
  const sin=linea.sin||[];
  const hay=tieneVariantes(mi);
  if(!hay&&!sin.length&&!linea.nota) return null;
  return(
    <div className="ol-var">
      {sin.length>0&&<span className="ol-sin">sin {sin.join(', ')}</span>}
      {linea.nota&&<span className="ol-nota">“{linea.nota}”</span>}
      {onEditar&&hay&&<button className="ol-var-btn" onClick={onEditar}>
        {sin.length||linea.nota?'✎ Editar':'✎ Variantes'}
      </button>}
    </div>
  );
}

// Panel para desmarcar ingredientes y dejar una nota para cocina
function VariantesModal({item,linea,onConfirm,onCancel}){
  const ingredientes=(item&&item.ingredientes)||[];
  const [sin,setSin]=useState(linea?.sin||[]);
  const [nota,setNota]=useState(linea?.nota||'');
  function toggle(ing){
    setSin(prev=>prev.includes(ing)?prev.filter(x=>x!==ing):[...prev,ing]);
  }
  return(
    <div className="peso-overlay" onClick={e=>{if(e.target===e.currentTarget)onCancel();}}>
      <div className="var-modal fade-up">
        <div className="var-hdr">
          <div className="var-title">{item.emoji} {item.nombre}</div>
          <div className="var-sub">Desmarca lo que NO lleva</div>
        </div>
        <div className="var-lista">
          {ingredientes.map(ing=>{
            const quitado=sin.includes(ing);
            return(
              <button key={ing} className={`var-ing${quitado?' quitado':''}`} onClick={()=>toggle(ing)}>
                <span className="var-check">{quitado?'✕':'✓'}</span>
                <span className="var-ing-name">{ing}</span>
                {quitado&&<span className="var-tag">SIN</span>}
              </button>
            );
          })}
        </div>
        <div className="field" style={{marginBottom:14}}>
          <label>Nota para cocina (opcional)</label>
          <input placeholder="Ej: bien cocido, aparte, para llevar"
            value={nota} maxLength={140} onChange={e=>setNota(e.target.value)}/>
        </div>
        {(sin.length>0||nota)&&(
          <div className="var-resumen">
            {sin.length>0&&<div>🚫 Sin: <b>{sin.join(', ')}</b></div>}
            {nota&&<div>📝 {nota}</div>}
          </div>
        )}
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-primary btn-full" onClick={()=>onConfirm(sin,nota.trim())}>
            {linea?'Guardar':'Agregar'}
          </button>
          <button className="btn btn-ghost" style={{minWidth:80}} onClick={onCancel}>✕</button>
        </div>
      </div>
    </div>
  );
}

// ── Modal de peso (carnicería, verdulería, tortillería) ───────────
function PesoModal({item, currency, max, onConfirm, onCancel}){
  const [peso,setPeso]=useState('');
  const pesoNum=parseFloat(peso)||0;
  const subtotal=pesoNum*item.precio;
  const unidad=item.unidad||'lb';
  const hayTope=max!=null&&max<SIN_CONTROL;
  const excede=hayTope&&pesoNum>max+0.0005;

  function handleKey(k){
    if(k==='del'){setPeso(p=>p.slice(0,-1));}
    else if(k==='.'){if(!peso.includes('.')) setPeso(p=>p+'.');}
    else{setPeso(p=>(p+k).slice(0,7));}
  }

  const keys=['7','8','9','4','5','6','1','2','3','.','0','del'];
  // Medidas de mostrador en Guatemala: cuarto, media, libra…
  const RAPIDAS=[
    {lbl:'¼',    val:0.25},{lbl:'½',    val:0.5},
    {lbl:'¾',    val:0.75},{lbl:'1',    val:1},
    {lbl:'1½',   val:1.5}, {lbl:'2',    val:2},
    {lbl:'3',    val:3},   {lbl:'5',    val:5},
  ];

  return(
    <div className="peso-overlay" onClick={e=>{if(e.target===e.currentTarget)onCancel();}}>
      <div className="peso-modal fade-up">
        <div className="peso-modal-title">{item.emoji} {item.nombre}</div>
        <div className="peso-modal-sub">Precio: {currency}{item.precio} / {unidad}{hayTope?` · Disponible: ${max.toFixed(2)} ${unidad}`:''}</div>
        <div className="peso-rapidas">
          {RAPIDAS.map(r=>(
            <button key={r.lbl} className={`peso-rapida${pesoNum===r.val?' active':''}`}
              disabled={hayTope&&r.val>max+0.0005}
              onClick={()=>setPeso(String(r.val))}>{r.lbl} {unidad}</button>
          ))}
        </div>
        <div className="field" style={{marginBottom:12}}>
          <label>Cantidad ({unidad})</label>
          <input type="number" step="0.01" min="0" placeholder="0.0"
            value={peso} onChange={e=>setPeso(e.target.value)}
            style={{fontSize:26,fontWeight:700,textAlign:'center'}}/>
        </div>
        <div className="peso-modal-calc">
          <div className="peso-modal-calc-lbl">{pesoNum} {unidad} × {currency}{item.precio}</div>
          <div className="peso-modal-calc-val">{currency}{subtotal.toFixed(2)}</div>
        </div>
        {excede&&<div className="peso-modal-warn">⚠ Solo quedan {max.toFixed(2)} {unidad} disponibles</div>}
        <div className="pin-keypad" style={{marginBottom:14}}>
          {keys.map(k=>(
            <button key={k} className={`pin-key${k==='del'?' del':''}`} onClick={()=>handleKey(k)} style={{padding:'12px',fontSize:'18px'}}>
              {k==='del'?'⌫':k}
            </button>
          ))}
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-primary btn-full" disabled={pesoNum<=0||excede} onClick={()=>onConfirm(pesoNum,subtotal)}>
            Agregar {pesoNum>0?`${pesoNum} ${unidad}`:''} →
          </button>
          <button className="btn btn-ghost" style={{minWidth:80}} onClick={onCancel}>✕</button>
        </div>
      </div>
    </div>
  );
}

// ── Mesas ─────────────────────────────────────────────────────────
function MesasTab({suc,addToast,reload}){
  const {mesas,menu,inventario,transacciones}=suc;
  const [mesaSel,setMesaSel]=useState(null);
  const [separando,setSeparando]=useState(false);
  const [cuentas,setCuentas]=useState([]);
  const [cuentaActiva,setCuentaActiva]=useState(0);
  const [cobrando,setCobrando]=useState(false);
  const [editVar,setEditVar]=useState(null);   // {clave,linea,mi} en edición
  const [showCajaMesa,setShowCajaMesa]=useState(false);
  const [efectivoMesa,setEfectivoMesa]=useState('');
  const efectivoMesaRef=useRef(null);

  const mesa=mesaSel!=null?mesas.find(m=>m.id===mesaSel):null;

  // Disponibilidad real: descuenta lo comprometido en TODAS las mesas
  // abiertas y agrupa los ítems que comparten el mismo insumo.
  function stockDisponible(menuId){
    return dispDe(menuId,{menu,inventario,mesas});
  }
  function getMenuSt(menuId){
    const mi=menu.find(m=>m.id===menuId);
    const d=stockDisponible(menuId);
    if(agotadoDe(d,mi)) return 'sin-stock';
    if(!mi||!mi.invId) return 'disponible';
    const inv=inventario.find(i=>i.id===mi.invId);
    if(!inv) return 'disponible';
    return (d*factorDe(mi))<=inv.min?'stock-bajo':'disponible';
  }

  function initCuentas(m){
    const n=Array.from({length:m.personas},(_,i)=>({id:i,label:'Persona '+(i+1),items:[],pagada:false}));
    setCuentas(n);setCuentaActiva(0);
  }
  function selMesa(id){setMesaSel(id);setSeparando(false);initCuentas(mesas.find(m=>m.id===id));}
  function volver(){setMesaSel(null);setSeparando(false);setCuentas([]);}

  async function patchMesa(id,patch){await S(suc.id,'/mesas/'+id,patch,'PUT');reload();}

  async function agregarItem(itemId,sin,nota){
    const mi=menu.find(m=>m.id===itemId);
    const d=stockDisponible(itemId);
    if(agotadoDe(d,mi)){addToast('Sin stock para este ítem','error');return;}
    if(d>=1&&d<2) addToast('⚠ Último disponible: '+mi.nombre,'warning');
    const nueva={id:itemId,nombre:mi.nombre,precio:mi.precio,qty:1,
      sin:sin||[],nota:nota||'',enviadas:0};
    const k=claveLinea(nueva);
    const orden=mesa.orden.map(l=>({...l}));
    const l=orden.find(x=>claveLinea(x)===k);
    if(l) l.qty++;
    else orden.push(nueva);
    await patchMesa(mesaSel,{orden,estado:'ocupada'});
  }
  async function quitarItem(clave){
    const orden=mesa.orden.map(l=>({...l}));
    const l=orden.find(x=>claveLinea(x)===clave);
    if(!l) return;
    l.qty--;
    if(l.enviadas>l.qty) l.enviadas=l.qty;
    const restante=orden.filter(x=>x.qty>0);
    await patchMesa(mesaSel,{orden:restante,estado:restante.length?'ocupada':'libre'});
  }
  // Cambia exclusiones/nota de una línea; si choca con otra igual, las une
  async function editarVariantes(clave,sin,nota){
    const orden=mesa.orden.map(l=>({...l}));
    const l=orden.find(x=>claveLinea(x)===clave);
    if(!l) return;
    l.sin=sin;l.nota=nota;l.enviadas=0;
    const k=claveLinea(l);
    const gemela=orden.find(x=>x!==l&&claveLinea(x)===k);
    let final=orden;
    if(gemela){gemela.qty+=l.qty;final=orden.filter(x=>x!==l);}
    await patchMesa(mesaSel,{orden:final});
    addToast('Variantes actualizadas ✓','success');
  }
  // Manda a cocina solo lo que aún no se ha mandado
  async function enviarACocina(){
    const pendientes=mesa.orden
      .map(l=>({...l,qty:parseFloat(((l.qty)-(l.enviadas||0)).toFixed(3))}))
      .filter(l=>l.qty>0);
    if(!pendientes.length){addToast('Todo fue enviado a cocina ya','error');return;}
    await S(suc.id,'/comandas',{origen:mesa.nombre,mesaId:mesaSel,items:pendientes},'POST');
    await patchMesa(mesaSel,{orden:mesa.orden.map(l=>({...l,enviadas:l.qty}))});
    addToast('🍳 Enviado a cocina ('+pendientes.length+' ítem/s)','success');
  }
  async function pedirCuenta(){
    if(!mesa.orden.length){addToast('La orden está vacía','error');return;}
    await patchMesa(mesaSel,{estado:'cuenta'});
    addToast('Mesa '+mesa.nombre+' pide la cuenta');
  }
  function cobrarMesa(){
    if(!mesa.orden.length){addToast('No hay nada que cobrar','error');return;}
    setShowCajaMesa(true);setEfectivoMesa('');
    setTimeout(()=>efectivoMesaRef.current?.focus(),150);
  }
  async function confirmarCobroMesa(){
    if(cobrando) return;
    // mesa.orden solo contiene lo NO cobrado: su total es lo que falta pagar
    const pend=mesa.orden.reduce((s,l)=>s+l.precio*l.qty,0);
    const efectivoNum=parseFloat(efectivoMesa)||0;
    if(efectivoNum<pend){addToast('Efectivo insuficiente','error');return;}
    const cambio=efectivoNum-pend;
    setCobrando(true);
    try{
      const r=await S(suc.id,'/cobrar',{mesaId:mesaSel,orden:mesa.orden,detalle:'Cuenta completa',cobradoParcial:false},'POST');
      addToast(`${mesa.nombre} · ${BRAND.currency}${pend} · Vuelto ${BRAND.currency}${cambio.toFixed(2)} ✓`,'success');
      avisarFaltantes(r,addToast);
      setShowCajaMesa(false);setEfectivoMesa('');reload();volver();
    }finally{setCobrando(false);}
  }
  async function cancelarOrden(){
    const pend=mesa.orden.reduce((s,l)=>s+l.precio*l.qty,0);
    if(pend>0&&!confirm(`Se descartará lo no cobrado (${BRAND.currency}${pend}) y la mesa quedará libre. ¿Continuar?`)) return;
    await patchMesa(mesaSel,{orden:[],estado:'libre',cobrado:0});
    setCuentas([]);setShowCajaMesa(false);volver();
  }
  async function cambiarPersonas(d){
    const np=Math.max(1,Math.min(20,mesa.personas+d));
    await patchMesa(mesaSel,{personas:np});
    const n=Array.from({length:np},(_,i)=>({id:i,label:'Persona '+(i+1),items:[],pagada:false}));
    setCuentas(n);setCuentaActiva(0);
  }
  function asignarItem(clave){
    const linea=mesa.orden.find(l=>claveLinea(l)===clave);if(!linea) return;
    const asig=cuentas.reduce((s,c)=>s+c.items.filter(it=>it.lineaId===clave).reduce((a,it)=>a+it.qty,0),0);
    if(asig>=linea.qty){addToast('Ya todos asignados','error');return;}
    setCuentas(prev=>prev.map((c,i)=>{
      if(i!==cuentaActiva) return c;
      const ex=c.items.find(it=>it.lineaId===clave);
      return{...c,items:ex
        ?c.items.map(it=>it.lineaId===clave?{...it,qty:it.qty+1}:it)
        :[...c.items,{lineaId:clave,id:linea.id,nombre:linea.nombre,precio:linea.precio,qty:1,sin:linea.sin||[],nota:linea.nota||''}]};
    }));
  }
  function quitarDeCuenta(idx){
    setCuentas(prev=>prev.map((c,i)=>{
      if(i!==cuentaActiva) return c;
      return{...c,items:c.items.map((it,j)=>j===idx?{...it,qty:it.qty-1}:it).filter(it=>it.qty>0)};
    }));
  }
  async function cobrarCuenta(i){
    if(cobrando) return;
    const cuenta=cuentas[i];
    if(!cuenta.items.length){addToast('Esta cuenta está vacía','error');return;}
    const total=cuenta.items.reduce((s,it)=>s+it.precio*it.qty,0);
    const nuevas=cuentas.map((c,j)=>j===i?{...c,pagada:true}:c);
    setCobrando(true);
    try{
      // Siempre parcial: el servidor descuenta las líneas pagadas de la orden
      // y libera la mesa solo cuando ya no queda nada pendiente.
      const r=await S(suc.id,'/cobrar',{
        mesaId:mesaSel,
        orden:cuenta.items.map(it=>({id:it.id,nombre:it.nombre,precio:it.precio,qty:it.qty,sin:it.sin||[],nota:it.nota||''})),
        detalle:cuenta.label,cobradoParcial:true
      },'POST');
      setCuentas(nuevas);
      addToast('Cobrado '+cuenta.label+' '+BRAND.currency+total+' ✓','success');
      avisarFaltantes(r,addToast);
      reload();
      if(r&&r.liberada){addToast('Mesa liberada ✓','success');volver();}
      else{const sig=nuevas.findIndex(c=>!c.pagada);setCuentaActiva(sig>=0?sig:i);}
    }finally{setCobrando(false);}
  }

  const libres=mesas.filter(m=>m.estado==='libre').length;
  const ocupadas=mesas.filter(m=>m.estado!=='libre').length;
  const totalVentas=transacciones.reduce((s,t)=>s+t.total,0);
  const totalPendiente=mesas.reduce((s,m)=>s+m.orden.reduce((a,l)=>a+l.precio*l.qty,0),0);

  if(!mesaSel) return(
    <div className="panel fade-up">
      <div className="stats-row">
        <div className="stat-card"><div className="stat-label">Mesas libres</div><div className="stat-value green">{libres}</div></div>
        <div className="stat-card"><div className="stat-label">Mesas ocupadas</div><div className="stat-value yellow">{ocupadas}</div></div>
        <div className="stat-card"><div className="stat-label">Ventas hoy</div><div className="stat-value">{BRAND.currency}{totalVentas}</div></div>
        <div className="stat-card"><div className="stat-label">Por cobrar</div><div className="stat-value red">{totalPendiente>0?BRAND.currency+totalPendiente:'—'}</div><div className="stat-sub">en mesas activas</div></div>
      </div>
      <div className="mesas-grid">
        {mesas.map(m=>{
          const ord=m.orden.reduce((s,l)=>s+l.precio*l.qty,0);
          const pend=ord-(m.cobrado||0);
          return(
            <div key={m.id} className={`mesa-card ${m.estado}`} onClick={()=>selMesa(m.id)}>
              <div className="mesa-strip"/><div className="mesa-dot"/>
              <div className="mesa-num">{m.id}</div>
              <div className="mesa-nombre">{m.nombre}</div>
              <div className="mesa-lbl">{m.estado==='libre'?'Libre':m.estado==='cuenta'?'Pide cuenta':'Ocupada'}</div>
              {m.estado!=='libre'&&<div className="mesa-pendiente"><div className="mesa-pendiente-lbl">Por cobrar</div><div className="mesa-pendiente-val">{BRAND.currency}{pend}</div></div>}
              {m.cobrado>0&&<div className="mesa-cobrado">✓ {BRAND.currency}{m.cobrado} cobrado</div>}
            </div>
          );
        })}
      </div>
    </div>
  );

  // mesa.orden contiene SOLO lo que falta cobrar (el servidor retira las
  // líneas ya pagadas), así que el pendiente es su propio total.
  const pendienteMesa=mesa.orden.reduce((s,l)=>s+l.precio*l.qty,0);
  const cobradoMesa=mesa.cobrado||0;
  const totalCuenta=pendienteMesa+cobradoMesa;
  const efectivoMesaNum=parseFloat(efectivoMesa)||0;
  const cambioMesa=efectivoMesaNum-pendienteMesa;
  const quickMesa=DENOM.filter(d=>d>=pendienteMesa).slice(0,4);
  const asignados={};
  cuentas.forEach(c=>c.items.forEach(it=>{asignados[it.lineaId]=(asignados[it.lineaId]||0)+it.qty;}));
  const sinAsignar=mesa.orden.map(l=>{
    const k=claveLinea(l);const a=asignados[k]||0;const r=l.qty-a;
    return r>0?{...l,clave:k,disponible:r}:null;
  }).filter(Boolean);
  const porEnviar=mesa.orden.reduce((s,l)=>s+Math.max(0,l.qty-(l.enviadas||0)),0);
  const cuentaAct=cuentas[cuentaActiva];

  return(
    <div className="panel fade-up">
      <div className="orden-hdr">
        <button className="back-btn" onClick={volver}>← Mesas</button>
        <div className="orden-title">{mesa.nombre}</div>
        <span className={`badge badge-${mesa.estado}`}>{mesa.estado==='libre'?'Libre':mesa.estado==='cuenta'?'Pide cuenta':'Ocupada'}</span>
      </div>
      <div className="orden-layout">
        <div className="orden-menu-col">
          <div className="sec-hdr">Menú</div>
          <div className="menu-grid">
            {menu.map(item=>{
              const st=getMenuSt(item.id);
              const disp=stockDisponible(item.id);
              const inv=item.invId?inventario.find(i=>i.id===item.invId):null;
              return(
                <div key={item.id} className={`menu-card ${st}`} onClick={st!=='sin-stock'?()=>agregarItem(item.id):undefined}>
                  <div className="mc-info">
                    <div className="mc-name">{item.emoji} {item.nombre}</div>
                    <div className="mc-price">{BRAND.currency}{item.precio}</div>
                    {inv&&<div className={`mc-stock ${st==='sin-stock'?'agotado':st==='stock-bajo'?'bajo':'ok'}`}>{st==='sin-stock'?'Agotado':dispTxt(disp,item)+' disp.'}</div>}
                  </div>
                  <button className="mc-add" disabled={st==='sin-stock'} onClick={e=>{e.stopPropagation();if(st!=='sin-stock')agregarItem(item.id);}}>+</button>
                </div>
              );
            })}
          </div>
        </div>

        <div className="sidebar">
          <div className="sidebar-hdr">
            <div className="sidebar-hdr-title">Orden — {mesa.nombre}</div>
            <button className="btn-pide" onClick={pedirCuenta}>Pedir cuenta</button>
          </div>
          <div className="personas-row">
            <span className="personas-lbl">Personas</span>
            <div className="personas-ctrl">
              <button className="p-btn" onClick={()=>cambiarPersonas(-1)}>−</button>
              <span className="p-num">{mesa.personas}</span>
              <button className="p-btn" onClick={()=>cambiarPersonas(1)}>+</button>
            </div>
          </div>
          <div className="sep-row">
            <button className={`sep-btn${separando?' on':''}`} onClick={()=>setSeparando(s=>!s)}>
              {separando?'↩ Ver orden completa':'Separar cuentas por persona'}
            </button>
            {!separando&&<button className="btn-cocina" disabled={!porEnviar} onClick={enviarACocina}>
              🍳 {porEnviar?`Enviar a cocina (${+porEnviar.toFixed(2)})`:'Todo en cocina'}
            </button>}
          </div>

          {!separando?(
            <>
              <div className="order-lines">
                {!mesa.orden.length?<div className="empty-msg">Sin ítems aún</div>
                  :mesa.orden.map(l=>{
                    const k=claveLinea(l);
                    const mi=menu.find(m=>m.id===l.id);
                    const pend=Math.max(0,l.qty-(l.enviadas||0));
                    return(
                      <div key={k} className="order-line">
                        <div className="ol-name">
                          {l.nombre}
                          {pend>0&&<span className="ol-pend" title="Aún no enviado a cocina">●</span>}
                          <LineaVariantes linea={l} mi={mi} onEditar={()=>setEditVar({clave:k,linea:l,mi})}/>
                        </div>
                        <div className="ol-ctrl">
                          <button className="ol-btn" onClick={()=>quitarItem(k)}>−</button>
                          <span className="ol-qty">{l.qty}</span>
                          <button className="ol-btn" onClick={()=>agregarItem(l.id,l.sin,l.nota)}>+</button>
                        </div>
                        <div className="ol-price">{BRAND.currency}{l.precio*l.qty}</div>
                      </div>
                    );
                  })
                }
              </div>
              <div className="sidebar-footer">
                {showCajaMesa?(
                  <div className="caja-registradora">
                    <div className="caja-reg-total-box">
                      <div className="caja-reg-total-lbl">Total a cobrar</div>
                      <div className="caja-reg-total-val">{BRAND.currency}{pendienteMesa}</div>
                    </div>
                    {quickMesa.length>0&&(
                      <div className="caja-quick-row">
                        {quickMesa.map(d=>(
                          <button key={d} className={`caja-quick-btn${efectivoMesaNum===d?' active':''}`} onClick={()=>setEfectivoMesa(String(d))}>{BRAND.currency}{d}</button>
                        ))}
                      </div>
                    )}
                    <div className="caja-reg-input-wrap">
                      <div className="caja-reg-input-lbl">Efectivo recibido</div>
                      <div className="caja-reg-input-field">
                        <span className="caja-reg-currency-sym">{BRAND.currency}</span>
                        <input ref={efectivoMesaRef} type="number" inputMode="decimal" className="caja-reg-input" value={efectivoMesa} onChange={e=>setEfectivoMesa(e.target.value)} placeholder="0" min="0" step="1"/>
                      </div>
                    </div>
                    {efectivoMesaNum>0&&(
                      <div className={`caja-reg-cambio-box ${cambioMesa>=0?'ok':'falta'}`}>
                        <div className="caja-cambio-lbl">{cambioMesa>=0?'Vuelto':'Falta'}</div>
                        <div className="caja-cambio-val">{BRAND.currency}{Math.abs(cambioMesa).toFixed(2)}</div>
                      </div>
                    )}
                    <button className="mos-btn-cobrar" disabled={cobrando||!efectivoMesa||efectivoMesaNum<pendienteMesa} onClick={confirmarCobroMesa}>
                      {cobrando?'Cobrando…':'Confirmar Cobro'}
                    </button>
                    <button className="mos-btn-cancel" onClick={()=>setShowCajaMesa(false)}>← Volver al ticket</button>
                  </div>
                ):(
                  <>
                    {totalCuenta>0&&(
                      <div className="footer-desglose">
                        <div className="footer-row"><span className="lbl">Total cuenta</span><span className="val total-fx">{BRAND.currency}{totalCuenta}</span></div>
                        {cobradoMesa>0&&<><hr className="footer-divider"/><div className="footer-row"><span className="lbl">✓ Cobrado</span><span className="val cobrado">{BRAND.currency}{cobradoMesa}</span></div></>}
                        <hr className="footer-divider"/>
                        <div className="footer-row"><span className="lbl">Por cobrar</span><span className="val pendiente">{BRAND.currency}{pendienteMesa}</span></div>
                      </div>
                    )}
                    <button className="btn btn-primary btn-full" disabled={!mesa.orden.length} onClick={cobrarMesa}>Cobrar {BRAND.currency}{pendienteMesa}</button>
                    <button className="btn btn-ghost btn-full" style={{marginTop:6}} onClick={cancelarOrden}>Cancelar orden</button>
                  </>
                )}
              </div>
            </>
          ):(
            <div className="csep">
              <div className="ctabs">
                {cuentas.map((c,i)=>{const ct=c.items.reduce((s,it)=>s+it.precio*it.qty,0);return<button key={i} className={`ctab${c.pagada?' pagada':i===cuentaActiva?' active':''}`} onClick={()=>setCuentaActiva(i)}>{c.label}{ct>0?' Q'+ct:''}</button>;})}
              </div>
              <div className="sin-asignar">
                <div className="sa-lbl">Sin asignar</div>
                {!sinAsignar.length?<div className="todo-ok">✓ Todos asignados</div>
                  :sinAsignar.map(l=><div key={l.clave} className="sa-item"><span className="sa-name">{l.nombre}{(l.sin||[]).length?<em className="sa-sin"> sin {l.sin.join(', ')}</em>:null}</span><span className="sa-disp">×{l.disponible}</span><button className="btn-asignar" onClick={()=>asignarItem(l.clave)}>Asignar</button></div>)
                }
              </div>
              {cuentaAct&&!cuentaAct.pagada?(
                <>
                  <div className="cuenta-lines">
                    {!cuentaAct.items.length?<div className="empty-msg">Sin ítems en {cuentaAct.label}</div>
                      :cuentaAct.items.map((it,idx)=><div key={idx} className="order-line"><div className="ol-name">{it.nombre}</div><div className="ol-ctrl"><button className="ol-btn" onClick={()=>quitarDeCuenta(idx)}>−</button><span className="ol-qty">{it.qty}</span></div><div className="ol-price">{BRAND.currency}{it.precio*it.qty}</div></div>)
                    }
                  </div>
                  <div className="csep-footer">
                    <div className="ctotal-row"><span className="ctotal-lbl">{cuentaAct.label}</span><span className="ctotal-val">{BRAND.currency}{cuentaAct.items.reduce((s,it)=>s+it.precio*it.qty,0)}</span></div>
                    <button className="btn-cobrar-cuenta" disabled={!cuentaAct.items.length} onClick={()=>cobrarCuenta(cuentaActiva)}>Cobrar {BRAND.currency}{cuentaAct.items.reduce((s,it)=>s+it.precio*it.qty,0)}</button>
                  </div>
                </>
              ):<div className="cuenta-lines"><div className="empty-msg" style={{color:'var(--green)'}}>✓ Cobrada</div></div>}
            </div>
          )}
        </div>
      </div>
      {editVar&&<VariantesModal item={editVar.mi} linea={editVar.linea}
        onConfirm={(sin,nota)=>{editarVariantes(editVar.clave,sin,nota);setEditVar(null);}}
        onCancel={()=>setEditVar(null)}/>}
    </div>
  );
}

// ── Mostrador (toma express / tablet) ─────────────────────────────
const DENOM=[10,20,50,100,200,500];
function MostradorTab({suc,addToast,reload}){
  const {menu,inventario,transacciones,mesas}=suc;
  const [orden,setOrden]=useState([]);
  const [showCaja,setShowCaja]=useState(false);
  const [efectivo,setEfectivo]=useState('');
  const [pesoItem,setPesoItem]=useState(null); // item que abrió el modal de peso
  const [cobrando,setCobrando]=useState(false);
  const [editVar,setEditVar]=useState(null);   // {idx,linea,mi} en edición
  const efectivoRef=useRef(null);
  const behavior=RUBRO_BEHAVIOR[suc.tipo]||RUBRO_BEHAVIOR.mostrador;

  const ticketsHoy=useMemo(()=>transacciones.filter(t=>t.mostrador),[transacciones]);
  const nextTicket=ticketsHoy.length+1;
  const total=orden.reduce((s,l)=>s+l.precio*l.qty,0);
  const efectivoNum=parseFloat(efectivo)||0;
  const cambio=efectivoNum-total;

  // Descuenta el carrito en curso Y las mesas abiertas del mismo rubro
  function stockDisponible(menuId){
    return dispDe(menuId,{menu,inventario,mesas,carrito:orden});
  }
  function getEst(menuId){
    const mi=menu.find(m=>m.id===menuId);
    const d=stockDisponible(menuId);
    if(agotadoDe(d,mi)) return 'sin-stock';
    if(!mi||!mi.invId) return 'ok';
    const inv=inventario.find(i=>i.id===mi.invId);
    if(!inv) return 'ok';
    return (d*factorDe(mi))<=inv.min?'bajo':'ok';
  }

  function agregar(itemId,sin,nota){
    const mi=menu.find(m=>m.id===itemId);
    const d=stockDisponible(itemId);
    if(agotadoDe(d,mi)){addToast('Sin stock','error');return;}
    // Modal de peso solo para ítems vendidos por lb/kg
    if(esPesoItem(mi)){
      setPesoItem(mi); return;
    }
    const nueva={id:itemId,nombre:mi.nombre,precio:mi.precio,qty:1,unidad:mi.unidad||'u',
      sin:sin||[],nota:nota||''};
    const k=claveLinea(nueva);
    setOrden(prev=>{
      const l=prev.find(x=>!x._pesoLine&&claveLinea(x)===k);
      if(l) return prev.map(x=>x===l?{...x,qty:x.qty+1}:x);
      return [...prev,nueva];
    });
  }
  // Cambia exclusiones/nota de una línea del ticket y une las que queden iguales
  function editarVariantes(idx,sin,nota){
    setOrden(prev=>{
      const base=prev.map((x,i)=>i===idx?{...x,sin,nota}:x);
      const l=base[idx];const k=claveLinea(l);
      const gi=base.findIndex((x,i)=>i!==idx&&!x._pesoLine&&claveLinea(x)===k);
      if(gi<0) return base;
      return base.map((x,i)=>i===gi?{...x,qty:x.qty+l.qty}:x).filter((_,i)=>i!==idx);
    });
    addToast('Variantes actualizadas ✓','success');
  }

  function agregarConPeso(peso,subtotal){
    const mi=pesoItem;
    const unidad=mi.unidad||'lb';
    const disp=stockDisponible(mi.id);
    if(disp<SIN_CONTROL&&peso>disp+0.0005){
      addToast(`Solo quedan ${disp.toFixed(2)} ${unidad} de ${mi.nombre}`,'error');
      return;
    }
    setOrden(prev=>[...prev,{id:mi.id,nombre:mi.nombre,precio:mi.precio,qty:peso,unidad,_pesoLine:true}]);
    setPesoItem(null);
  }
  function quitar(idx){
    setOrden(prev=>prev.map((x,i)=>i===idx?{...x,qty:x.qty-1}:x).filter(x=>x.qty>0));
  }
  function limpiar(){
    if(!orden.length) return;
    if(!confirm('¿Cancelar ticket actual?')) return;
    setOrden([]);setShowCaja(false);setEfectivo('');
  }
  function initCobro(){
    if(!orden.length){addToast('Ticket vacío','error');return;}
    setShowCaja(true);setEfectivo('');
    setTimeout(()=>efectivoRef.current?.focus(),150);
  }
  async function confirmarCobro(){
    if(cobrando) return;
    if(efectivoNum<total){addToast('Efectivo insuficiente','error');return;}
    setCobrando(true);
    try{
      const r=await S(suc.id,'/cobrar',{
        mesaId:0,orden,detalle:'Ticket #'+nextTicket,cobradoParcial:false,mostrador:true
      },'POST');
      addToast(`Ticket #${nextTicket} · ${BRAND.currency}${total} · Vuelto ${BRAND.currency}${cambio.toFixed(2)} ✓`,'success');
      avisarFaltantes(r,addToast);
      setOrden([]);setShowCaja(false);setEfectivo('');reload();
    }finally{setCobrando(false);}
  }

  const ultimos=ticketsHoy.slice(0,5);
  const quickAmounts=DENOM.filter(d=>d>=total).slice(0,4);

  return(
    <div className="mos-panel fade-up">
      {pesoItem&&<PesoModal item={pesoItem} currency={BRAND.currency} max={stockDisponible(pesoItem.id)} onConfirm={agregarConPeso} onCancel={()=>setPesoItem(null)}/>}
      {editVar&&<VariantesModal item={editVar.mi} linea={editVar.linea}
        onConfirm={(sin,nota)=>{editarVariantes(editVar.idx,sin,nota);setEditVar(null);}}
        onCancel={()=>setEditVar(null)}/>}
      <div className="mos-hdr">
        <div className="mos-title">Mostrador · Toma express</div>
        <div className="mos-ticket">Ticket <b>#{nextTicket}</b></div>
      </div>

      <div className="mos-layout">
        <div className="mos-menu-col">
          <div className="mos-menu-grid">
            {menu.map(item=>{
              const est=getEst(item.id);
              const disp=stockDisponible(item.id);
              const unidad=item.unidad&&item.unidad!=='u'?item.unidad:null;
              return(
                <button key={item.id}
                  className={`mos-card${est==='sin-stock'?' sin-stock':''}`}
                  disabled={est==='sin-stock'}
                  onClick={()=>agregar(item.id)}>
                  <div className="mos-emoji">{item.emoji}</div>
                  <div className="mos-name">{item.nombre}</div>
                  <div className="mos-price">{BRAND.currency}{item.precio}{unidad?<span style={{fontSize:'11px',fontWeight:400}}> /{unidad}</span>:null}</div>
                  {item.invId&&<div className={`mos-stock ${est}`}>{est==='sin-stock'?'Agotado':est==='bajo'?dispTxt(disp,item)+' disp.':''}</div>}
                  {unidad&&<div className="mos-unit">por {unidad}</div>}
                </button>
              );
            })}
          </div>

          {ultimos.length>0&&(
            <div className="mos-history">
              <div className="sec-hdr">Últimos tickets</div>
              <div className="card" style={{padding:0}}>
                {ultimos.map((t,i)=>(
                  <div key={i} className="mos-hist-row">
                    <div>
                      <div className="mos-hist-tkt">{t.mesaNombre}</div>
                      <div className="mos-hist-time">{t.hora} · {t.orden?.reduce((s,l)=>s+l.qty,0)||0} ítem(s)</div>
                    </div>
                    <div className="mos-hist-total">{BRAND.currency}{t.total}</div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>

        <div className="mos-sidebar">
          <div className="mos-sidebar-hdr">
            <div className="mos-sidebar-ttl">Ticket actual</div>
            <div className="mos-sidebar-sub">#{nextTicket}</div>
          </div>
          <div className="mos-order">
            {!orden.length?<div className="empty-msg">Toca un producto para agregar</div>
              :orden.map((l,idx)=>(
                <div key={idx} className="order-line">
                  <div className="ol-name">
                    {l.nombre}
                    {l.unidad&&l.unidad!=='u'&&<span style={{fontSize:'10px',color:'var(--text3)',marginLeft:4}}>{l.qty} {l.unidad}</span>}
                    <LineaVariantes linea={l} mi={menu.find(m=>m.id===l.id)}
                      onEditar={()=>setEditVar({idx,linea:l,mi:menu.find(m=>m.id===l.id)})}/>
                  </div>
                  <div className="ol-ctrl">
                    {l._pesoLine
                      ?<button className="ol-btn" onClick={()=>setOrden(prev=>prev.filter((_,i)=>i!==idx))}>×</button>
                      :<><button className="ol-btn" onClick={()=>quitar(idx)}>−</button>
                        <span className="ol-qty">{l.qty}</span>
                        <button className="ol-btn" onClick={()=>agregar(l.id,l.sin,l.nota)}>+</button></>
                    }
                  </div>
                  <div className="ol-price">{BRAND.currency}{(l.precio*l.qty).toFixed(2)}</div>
                </div>
              ))
            }
          </div>
          {showCaja?(
            <div className="caja-registradora">
              <div className="caja-reg-total-box">
                <div className="caja-reg-total-lbl">Total a cobrar</div>
                <div className="caja-reg-total-val">{BRAND.currency}{total}</div>
              </div>
              {quickAmounts.length>0&&(
                <div className="caja-quick-row">
                  {quickAmounts.map(d=>(
                    <button key={d} className={`caja-quick-btn${efectivoNum===d?' active':''}`} onClick={()=>setEfectivo(String(d))}>
                      {BRAND.currency}{d}
                    </button>
                  ))}
                </div>
              )}
              <div className="caja-reg-input-wrap">
                <div className="caja-reg-input-lbl">Efectivo recibido</div>
                <div className="caja-reg-input-field">
                  <span className="caja-reg-currency-sym">{BRAND.currency}</span>
                  <input ref={efectivoRef} type="number" className="caja-reg-input" value={efectivo} onChange={e=>setEfectivo(e.target.value)} placeholder="0" min="0" step="1"/>
                </div>
              </div>
              {efectivoNum>0&&(
                <div className={`caja-reg-cambio-box ${cambio>=0?'ok':'falta'}`}>
                  <div className="caja-cambio-lbl">{cambio>=0?'Vuelto':'Falta'}</div>
                  <div className="caja-cambio-val">{BRAND.currency}{Math.abs(cambio).toFixed(2)}</div>
                </div>
              )}
              <button className="mos-btn-cobrar" disabled={cobrando||!efectivo||efectivoNum<total} onClick={confirmarCobro}>{cobrando?'Cobrando…':'Confirmar Cobro'}</button>
              <button className="mos-btn-cancel" onClick={()=>setShowCaja(false)}>← Volver al ticket</button>
            </div>
          ):(
            <div className="mos-footer">
              <div className="mos-total-row">
                <div className="mos-total-lbl">Total</div>
                <div className="mos-total-val">{BRAND.currency}{total}</div>
              </div>
              <button className="mos-btn-cobrar" disabled={!orden.length} onClick={initCobro}>
                Cobrar {BRAND.currency}{total}
              </button>
              <button className="mos-btn-cancel" onClick={limpiar} disabled={!orden.length}>Cancelar ticket</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Pantalla de cocina ────────────────────────────────────────────
const COL_COCINA=[
  {estado:'pendiente', titulo:'Por preparar', icono:'🔔', accion:'Empezar',  siguiente:'preparando'},
  {estado:'preparando',titulo:'En preparación',icono:'🍳', accion:'Listo',    siguiente:'listo'},
  {estado:'listo',     titulo:'Listos',        icono:'✅', accion:'Entregar', siguiente:null},
];

function minutosDesde(ts,ahora){return Math.max(0,Math.floor((ahora-ts)/60000));}

function CocinaTab({suc,addToast,reload}){
  const comandas=suc.comandas||[];
  const [ahora,setAhora]=useState(Date.now());
  const [filtro,setFiltro]=useState('pendiente'); // solo se usa en móvil

  // El reloj corre para que el tiempo de espera no quede congelado
  useEffect(()=>{const id=setInterval(()=>setAhora(Date.now()),20000);return()=>clearInterval(id);},[]);

  async function cambiar(c,estado){
    if(estado===null){
      await S(suc.id,'/comandas/'+c.id,null,'DELETE');
      addToast('Comanda entregada ✓','success');
    }else{
      await S(suc.id,'/comandas/'+c.id,{estado},'PUT');
    }
    reload();
  }
  async function limpiarListos(){
    const n=comandas.filter(c=>c.estado==='listo').length;
    if(!n){addToast('No hay comandas listas','error');return;}
    if(!confirm(`¿Quitar ${n} comanda(s) ya lista(s)?`)) return;
    await S(suc.id,'/comandas/limpiar',{},'POST');
    reload();addToast('Comandas listas archivadas');
  }

  const porEstado=e=>comandas.filter(c=>c.estado===e);
  const espera=porEstado('pendiente').concat(porEstado('preparando'));
  const masVieja=espera.length?Math.max(...espera.map(c=>minutosDesde(c.ts,ahora))):0;

  return(
    <div className="panel fade-up">
      <div className="coc-hdr">
        <div>
          <div className="coc-title">🍳 Cocina</div>
          <div className="coc-sub">
            {espera.length?`${espera.length} comanda(s) en espera`:'Todo al día — sin pendientes'}
            {masVieja>0&&` · la más antigua hace ${masVieja} min`}
          </div>
        </div>
        {porEstado('listo').length>0&&(
          <button className="btn btn-ghost btn-sm" onClick={limpiarListos}>Archivar listas</button>
        )}
      </div>

      {/* Selector por columna — solo visible en móvil */}
      <div className="coc-filtros">
        {COL_COCINA.map(col=>(
          <button key={col.estado} className={`coc-filtro${filtro===col.estado?' on':''}`}
            onClick={()=>setFiltro(col.estado)}>
            {col.icono} {col.titulo}
            <span className="coc-badge">{porEstado(col.estado).length}</span>
          </button>
        ))}
      </div>

      <div className="coc-cols">
        {COL_COCINA.map(col=>{
          const lista=porEstado(col.estado);
          return(
            <div key={col.estado} className={`coc-col ${col.estado}${filtro===col.estado?' activa':''}`}>
              <div className="coc-col-hdr">
                <span>{col.icono} {col.titulo}</span>
                <span className="coc-badge">{lista.length}</span>
              </div>
              <div className="coc-col-body">
                {!lista.length
                  ?<div className="coc-vacio">Sin comandas</div>
                  :lista.map(c=>{
                    const min=minutosDesde(c.ts,ahora);
                    const urg=c.estado==='listo'?'ok':min>=20?'tarde':min>=10?'medio':'ok';
                    return(
                      <div key={c.id} className={`coc-card ${urg}`}>
                        <div className="coc-card-hdr">
                          <span className="coc-origen">{c.origen}</span>
                          <span className={`coc-tiempo ${urg}`}>{min===0?'ahora':min+' min'}</span>
                        </div>
                        <div className="coc-items">
                          {c.items.map((it,i)=>(
                            <div key={i} className="coc-item">
                              <span className="coc-qty">{+Number(it.qty).toFixed(3)}{it.unidad&&it.unidad!=='u'?' '+it.unidad:'×'}</span>
                              <div className="coc-item-body">
                                <div className="coc-item-name">{it.nombre}</div>
                                {(it.sin||[]).length>0&&(
                                  <div className="coc-sins">
                                    {it.sin.map(x=><span key={x} className="coc-sin">SIN {x}</span>)}
                                  </div>
                                )}
                                {it.nota&&<div className="coc-nota">📝 {it.nota}</div>}
                              </div>
                            </div>
                          ))}
                        </div>
                        <button className={`coc-accion ${col.estado}`} onClick={()=>cambiar(c,col.siguiente)}>
                          {col.accion}
                        </button>
                      </div>
                    );
                  })
                }
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Caja ──────────────────────────────────────────────────────────
function CajaTab({suc,rol,addToast,reload}){
  const tx=suc.transacciones;
  const total=tx.reduce((s,t)=>s+t.total,0);
  const totalPend=suc.mesas.reduce((s,m)=>s+m.orden.reduce((a,l)=>a+l.precio*l.qty,0),0);
  const prom=tx.length?Math.round(total/tx.length):0;

  // ── Cuadre de caja ──
  const caja=suc.caja||{inicial:0};
  const hoy=new Date().toLocaleDateString('es-GT');
  const txHoy=useMemo(()=>tx.filter(t=>!t.fecha||t.fecha===hoy),[tx,hoy]);
  const ventasHoy=txHoy.reduce((s,t)=>s+t.total,0);
  const fondo=parseFloat(caja.inicial)||0;
  const esperado=fondo+ventasHoy;
  const [conteo,setConteo]=useState('');
  const conteoNum=parseFloat(conteo);
  const hayConteo=conteo!==''&&!isNaN(conteoNum);
  const dif=hayConteo?conteoNum-esperado:0;

  // Agrupar por mesa+fecha
  const grupos=useMemo(()=>{
    const map={};
    tx.forEach(t=>{
      const key=t.mesaNombre+'__'+(t.fecha||'hoy');
      if(!map[key]) map[key]={mesa:t.mesaNombre,fecha:t.fecha||'',items:[],total:0};
      map[key].items.push(t);
      map[key].total+=t.total;
    });
    return Object.values(map);
  },[tx]);

  const [verDetalle,setVerDetalle]=useState(null);

  async function delTx(ts){
    if(!confirm('¿Eliminar esta transacción? No se puede deshacer.')) return;
    await S(suc.id,'/transacciones/'+ts,null,'DELETE');
    reload();addToast('Transacción eliminada');
  }

  return(
    <div className="panel fade-up">
      <div className="stats-row">
        <div className="stat-card"><div className="stat-label">Ventas hoy</div><div className="stat-value">{BRAND.currency}{total}</div></div>
        <div className="stat-card"><div className="stat-label">Por cobrar</div><div className="stat-value red">{BRAND.currency}{totalPend||0}</div></div>
        <div className="stat-card"><div className="stat-label">Ventas</div><div className="stat-value">{tx.length}</div></div>
        <div className="stat-card"><div className="stat-label">Venta promedio</div><div className="stat-value">{BRAND.currency}{prom}</div></div>
      </div>
      {/* Cuadre de caja */}
      <div className="cuadre-card">
        <div className="cuadre-hdr">
          <div className="cuadre-ttl">🧾 Cuadre de caja — {hoy}</div>
          {caja.ts
            ?<div className="cuadre-meta">Fondo abierto {caja.fecha} · {caja.hora}</div>
            :<div className="cuadre-meta warn">Sin fondo configurado — pídelo al administrador</div>}
        </div>
        <div className="cuadre-rows">
          <div className="cuadre-row"><span className="cr-lbl">Fondo inicial</span><span className="cr-val">{BRAND.currency}{fondo.toFixed(2)}</span></div>
          <div className="cuadre-row"><span className="cr-lbl">+ Ventas de hoy <span className="cr-sub">({txHoy.length})</span></span><span className="cr-val">{BRAND.currency}{ventasHoy.toFixed(2)}</span></div>
          <div className="cuadre-row esperado"><span className="cr-lbl">= Efectivo esperado</span><span className="cr-val">{BRAND.currency}{esperado.toFixed(2)}</span></div>
        </div>
        <div className="cuadre-conteo">
          <label className="cuadre-conteo-lbl">Conteo físico en caja</label>
          <div className="cuadre-conteo-field">
            <span className="cuadre-sym">{BRAND.currency}</span>
            <input type="number" inputMode="decimal" placeholder="0.00" value={conteo} onChange={e=>setConteo(e.target.value)} min="0" step="0.01"/>
            {conteo!==''&&<button className="cuadre-clear" onClick={()=>setConteo('')} title="Limpiar">×</button>}
          </div>
        </div>
        {hayConteo&&(
          <div className={`cuadre-dif ${Math.abs(dif)<0.005?'ok':dif>0?'sobra':'falta'}`}>
            <span className="cd-lbl">{Math.abs(dif)<0.005?'✓ Caja cuadrada':dif>0?'Sobrante':'Faltante'}</span>
            <span className="cd-val">{BRAND.currency}{Math.abs(dif).toFixed(2)}</span>
          </div>
        )}
      </div>

      <div className="sec-hdr">Historial de ventas{rol==='admin'&&<span style={{fontSize:'11px',color:'var(--text3)',fontWeight:400,letterSpacing:0,textTransform:'none'}}> — Admin: puedes eliminar transacciones</span>}</div>
      {!grupos.length?<div className="empty-msg" style={{textAlign:'left'}}>Sin ventas aún</div>
        :grupos.map((g,gi)=>(
          <div key={gi} className="tx-group">
            <div className="tx-group-hdr">
              <div><div className="tx-group-mesa">{g.mesa}</div><div className="tx-group-fecha">{g.fecha}</div></div>
              <div className="tx-group-total">{BRAND.currency}{g.total}</div>
            </div>
            {g.items.map((t,i)=>{
              const lineas=t.orden||[];
              const abierto=verDetalle===t.ts;
              const nItems=lineas.reduce((a,l)=>a+l.qty,0);
              return(
                <div key={i}>
                  <div className={`tx-sub-row${lineas.length?' clickable':''}${abierto?' abierto':''}`}
                    onClick={lineas.length?()=>setVerDetalle(abierto?null:t.ts):undefined}>
                    <div>
                      <div className="tx-sub-info">
                        {lineas.length>0&&<span className="tx-caret">{abierto?'▾':'▸'}</span>}
                        {t.hora} · {t.detalle}
                      </div>
                      {lineas.length>0&&<div className="tx-sub-items">{lineas.length} producto(s) · {(+nItems.toFixed(2))} ítem(s)</div>}
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <div className="tx-sub-amt">{BRAND.currency}{t.total}</div>
                      {rol==='admin'&&t.ts&&<button className="inv-del" title="Eliminar" onClick={e=>{e.stopPropagation();delTx(t.ts);}}>×</button>}
                    </div>
                  </div>
                  {abierto&&(
                    <div className="tx-detalle">
                      {lineas.map((l,li)=>(
                        <div key={li} className="tx-det-row">
                          <span className="tx-det-qty">{(+Number(l.qty).toFixed(3))}{l.unidad&&l.unidad!=='u'?' '+l.unidad:'×'}</span>
                          <span className="tx-det-name">{l.nombre}</span>
                          <span className="tx-det-unit">{BRAND.currency}{l.precio}{l.unidad&&l.unidad!=='u'?'/'+l.unidad:''}</span>
                          <span className="tx-det-sub">{BRAND.currency}{(l.precio*l.qty).toFixed(2)}</span>
                        </div>
                      ))}
                      <div className="tx-det-total">
                        <span>Total del ticket</span>
                        <span>{BRAND.currency}{Number(t.total).toFixed(2)}</span>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        ))
      }
    </div>
  );
}

// ── Inventario ────────────────────────────────────────────────────
const UNIDADES=['u','lb','kg','docena','caja','paquete','porción','litro'];

function InventarioTab({suc,addToast,reload}){
  const {inventario}=suc;
  const [showForm,setShowForm]=useState(false);
  const [npN,setNpN]=useState('');const [npS,setNpS]=useState('');const [npM,setNpM]=useState('2');const [npU,setNpU]=useState('u');
  const [flashId,setFlashId]=useState(null);
  function getEst(i){return i.stock===0?'out':i.stock<=i.min?'low':'ok';}
  const sorted=[...inventario].sort((a,b)=>{const o={out:0,low:1,ok:2};return o[getEst(a)]-o[getEst(b)];});
  const agotados=inventario.filter(i=>i.stock===0);
  const bajos=inventario.filter(i=>i.stock>0&&i.stock<=i.min);
  async function upd(id,val){await S(suc.id,'/inventario/'+id,{stock:Math.max(0,parseFloat(val)||0)},'PUT');setFlashId(id);setTimeout(()=>setFlashId(null),1400);reload();addToast('Stock actualizado');}
  async function del(id){if(!confirm('¿Eliminar?')) return;await S(suc.id,'/inventario/'+id,null,'DELETE');reload();addToast('Eliminado');}
  async function add(){
    if(!npN.trim()){addToast('Escribe un nombre','error');return;}
    await S(suc.id,'/inventario',{nombre:npN.trim(),stock:parseFloat(npS)||0,min:parseFloat(npM)||2,unidad:npU},'POST');
    setNpN('');setNpS('');setNpM('2');setNpU('u');setShowForm(false);reload();addToast('Producto agregado ✓','success');
  }
  const bTxt={out:'Sin stock',low:'Stock bajo',ok:'OK'};
  const bCls={out:'inv-tr row-danger',low:'inv-tr row-warning',ok:'inv-tr'};
  return(
    <div className="panel fade-up">
      {(agotados.length>0||bajos.length>0)&&(
        <div className="inv-alerts">
          {agotados.length>0&&<div className="inv-alert danger"><span>⛔</span><div><b>Sin stock</b>{agotados.map(i=>i.nombre).join(', ')}</div></div>}
          {bajos.length>0&&<div className="inv-alert warning"><span>⚠️</span><div><b>Stock bajo</b>{bajos.map(i=>i.nombre).join(', ')}</div></div>}
        </div>
      )}
      <table className="inv-table">
        <thead><tr><th>Producto</th><th>Estado</th><th>Stock</th><th>Nivel</th><th>Unidad</th><th>Mín</th><th></th></tr></thead>
        <tbody>
          {sorted.map(item=>{
            const est=getEst(item);
            const pct=Math.min(100,item.min>0?Math.round(item.stock/item.min*50):100);
            return(
              <tr key={item.id} className={(flashId===item.id?bCls[est]+' just-updated':bCls[est])}>
                <td style={{fontWeight:'500'}}>{item.nombre}</td>
                <td><span className={`inv-badge ${est}`}>{bTxt[est]}</span></td>
                <td><input className="inv-input" type="number" step="0.01" defaultValue={item.stock} min="0" onBlur={e=>upd(item.id,e.target.value)} onKeyDown={e=>e.key==='Enter'&&upd(item.id,e.target.value)}/></td>

function MenuTab({suc,addToast,reload}){

  const invSel=f.invId?inventario.find(i=>i.id===parseInt(f.invId)):null;
  async function del(id){if(!confirm('¿Eliminar?')) return;await S(suc.id,'/menu/'+id,null,'DELETE');reload();addToast('Eliminado');}
  async function add(){
    if(!f.nombre.trim()||!f.precio){addToast('Nombre y precio requeridos','error');return;}
    const factor=parseFloat(f.factor);
    if(f.invId&&(!isFinite(factor)||factor<=0)){addToast('El consumo debe ser mayor que 0','error');return;}
    await S(suc.id,'/menu',{nombre:f.nombre.trim(),precio:parseFloat(f.precio)||0,emoji:f.emoji||'🍽',
      invId:f.invId?parseInt(f.invId):null,unidad:f.unidad||'u',factor:f.invId?factor:1,
      ingredientes:f.ingredientes.split(',').map(x=>x.trim()).filter(Boolean)},'POST');
    setF({nombre:'',precio:'',emoji:'🍽',invId:'',unidad:'u',factor:'1',ingredientes:''});setShowForm(false);reload();addToast('Ítem agregado ✓','success');
  }
  async function setIngredientes(item,texto){
    const lista=texto.split(',').map(x=>x.trim()).filter(Boolean);
    await S(suc.id,'/menu/'+item.id,{ingredientes:lista},'PUT');

                <div className="mac-inv">{inv?`→ ${inv.nombre} (${inv.stock} ${inv.unidad||'u'})`:'Sin inventario vinculado'}</div>

                    <span>{inv.unidad||'u'} por venta</span>

      </div>
      {!showForm
        ?<button className="btn btn-ghost btn-full" style={{marginTop:12}} onClick={()=>setShowForm(true)}>+ Agregar ítem al menú</button>
        :(
          <div className="add-form-wrap">
            <div className="add-form-title">Nuevo ítem en el menú</div>

            <div className="form-row2">

              </div>
              <div className="field"><label>Vincular a inventario</label>
